name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: microsoft
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - name: Download official Baritone dependency
        run: |
          mkdir -p libs
          curl --fail --location --retry 3 --output libs/baritone-api-fabric-1.17.0.jar https://github.com/cabaletta/baritone/releases/download/v1.17.0/baritone-api-fabric-1.17.0.jar
          echo 'a1646893c2a6338ea6bf1a3bdecf2cd743ede61e31a4324bd79a82f3d03360f9  libs/baritone-api-fabric-1.17.0.jar' | sha256sum --check
      - name: Test and package
        run: ./gradlew releaseZip --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: taskflow-bot-mc1.21.11
          path: |
            build/releases/*.zip
            build/libs/taskflow-bot-*-mc1.21.11.jar