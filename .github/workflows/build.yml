name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - name: Download Baritone build dependency
        run: |
          mkdir -p libs
          curl --fail --location --retry 3 --output libs/baritone-api-fabric-1.19.0.jar https://github.com/cabaletta/baritone/releases/download/v1.19.0/baritone-api-fabric-1.19.0.jar
          echo 'eca6e2fdf43c6657fe9fea10a8f9a7572d78dc91ad389b998b808bd28fa5b5d1  libs/baritone-api-fabric-1.19.0.jar' | sha256sum --check
      - name: Test and package
        run: ./gradlew releaseZip --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: minecraft-ai-bot
          path: |
            build/releases/*.zip
            build/libs/minecraft-ai-bot-1.0.1.jar
