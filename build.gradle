plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"minecraft-ai-bot" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	modImplementation files('libs/baritone-api-fabric-1.17.0.jar')
	implementation project(':bot-common')
	include project(':bot-common')
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

tasks.withType(ProcessResources).configureEach {
    exclude '**/secrets.properties'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('CREDITS.md', 'THIRD_PARTY.md')
    from('LICENSES') { into 'LICENSES' }
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

}

// A clean runtime bundle; only declared artifacts are included, never run/ or secrets.
tasks.register('releaseZip', Zip) {
    dependsOn ':bot-common:check'
    dependsOn tasks.named('build'), project(':bot-common').tasks.named('jar'), project(':bot-common').tasks.named('taskPack')
    destinationDirectory = layout.buildDirectory.dir('releases')
    archiveFileName = "taskflow-bot-${project.version}-mc${project.minecraft_version}.zip"
    from(tasks.named('remapJar')) { into 'mods' }
    from(project(':bot-common').tasks.named('jar')) { into 'tools'; rename { 'bot-console.jar' } }
    from({ zipTree(project(':bot-common').tasks.named('taskPack').get().archiveFile.get().asFile) })
    from('release-tools') { exclude 'export-task-recipes.cjs' }
    from('README.md')
    from('THIRD_PARTY.md')
    from('CREDITS.md')
    from('LICENSE')
    from('LICENSES') { into 'LICENSES' }
    from('INVENTORY.md')
}


base { archivesName = 'taskflow-bot' }

tasks.named('remapJar') { archiveFileName = 'taskflow-bot-' + project.version + '-mc' + project.minecraft_version + '.jar' }

// Loom's development launch needs Baritone's nested native library on the runtime classpath.
def baritoneNative = layout.buildDirectory.file('dev-libs/nether-pathfinder-1.6.jar')
def extractBaritoneNative = tasks.register('extractBaritoneNative', Copy) {
    from({ zipTree(file('libs/baritone-api-fabric-1.17.0.jar')) }) {
        include 'META-INF/jars/nether-pathfinder-1.6.jar'
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('dev-libs')
}
dependencies { runtimeOnly files(baritoneNative).builtBy(extractBaritoneNative) }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.named('runClient', JavaExec) {
    dependsOn extractBaritoneNative
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}